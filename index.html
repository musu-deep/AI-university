سياق بين المحاولات'],['مشروع قصير','القدرة على التنفيذ واتخاذ القرار','سجل إسهام ومناقشة شفهية'],['اختبار عملي مراقب','المهارات والأدوات','تحديد صريح للأدوات المسموحة'],['مناقشة أداء','الفهم العميق وحدود الحل','أسئلة متكافئة وتسجيل قرار المقيمين']].map(r=>`<tr>${r.map((c,i)=>`<td class="${i===0?'primary-cell':''}">${c}</td>`).join('')}</tr>`).join(''))}</article>`}
function pageLabs(){return `${heading('التعلم المتصل بالواقع','المختبرات التطبيقية','مسارات للتجريب والمحاكاة والعمل مع جهات شريكة، بما يلائم طبيعة كل تخصص.',btn('تسجيل تحدٍ تطبيقي','new-lab','btn-primary','plus'))}<div class="metric-grid">${metric('تحديات مفتوحة','14','من جهات شريكة','spark')}${metric('مشاريع قيد التنفيذ','31','عبر مسارات متنوعة','trend')}${metric('بيئات محاكاة','6','متاحة على مدار الساعة','book')}${metric('تجارب ميدانية','9','تتطلب بروتوكول سلامة','shield')}</div><div class="program-grid"><article class="program-card"><div class="program-icon">⌁</div><div class="program-name">محاكاة الأنظمة والبيانات</div><div class="program-desc">مختبر رقمي للبيانات الاصطناعية، ونماذج اتخاذ القرار، واختبار السيناريوهات.</div><div class="program-meta"><span class="tag">مخاطر منخفضة</span><span class="tag">ذاتي</span></div><button class="btn" data-action="launch-lab">دخول بيئة المحاكاة ${svg.arrow}</button></article><article class="program-card"><div class="program-icon">◌</div><div class="program-name">مختبرات مرتبطة بأجهزة</div><div class="program-desc">تجارب عن بُعد أو حضورية بالتعاون مع مختبرات ومرافق تعليمية معتمدة.</div><div class="program-meta"><span class="tag">إشراف مطلوب</span><span class="tag">بروتوكول سلامة</span></div><button class="btn" data-action="launch-lab">عرض التجارب ${svg.arrow}</button></article><article class="program-card"><div class="program-icon">⌖</div><div class="program-name">مشروعات ميدانية مشتركة</div><div class="program-desc">تطبيق الكفايات على تحديات حقيقية مع شركاء يقيّمون جودة التنفيذ والأثر.</div><div class="program-meta"><span class="tag">شريك ميداني</span><span class="tag">تقييم مشترك</span></div><button class="btn" data-action="launch-lab">استعراض التحديات ${svg.arrow}</button></article></div><div class="grid-equal" style="margin-top:16px"><article class="card">${cardHead('تحديات مختارة','بيانات تدريبية افتراضية')}<div class="activity-list"><div class="activity"><span class="activity-icon">01</span><div><div class="activity-title">تقليل هدر المياه في مبانٍ تعليمية</div><div class="activity-desc">شريك: مختبر الاستدامة · مسار هندسة الحلول</div></div>${status('تسجيل مفتوح','good')}</div><div class="activity"><span class="activity-icon">02</span><div><div class="activity-title">كشف انحياز في بيانات خدمة رقمية</div><div class="activity-desc">شريك: مركز بيانات تجريبي · مسار علوم البيانات</div></div>${status('تسجيل مفتوح','good')}</div></div></article><article class="card">${cardHead('بوابة السلامة والتجريب')}<div class="callout"><span class="callout-symbol">!</span><div><strong>تحديد مخاطر المهمة قبل التنفيذ</strong><p>التجارب المادية أو التي تشمل أشخاصًا أو بيانات حساسة تتطلب موافقة الجهة، وبروتوكول سلامة ومشرفًا مؤهلًا. لا يجيز النظام للوكيل تنفيذها ذاتيًا.</p></div></div></article></div>`}
function pageGovernance(){return `${heading('الثقة المؤسسية','الحوكمة والجودة','الوكيل يعمل ضمن صلاحيات؛ وكل قرار أكاديمي له أثر وسجل ومراجع ومسار اعتراض.',btn('تصدير سجل التدقيق','export','','export'))}<div class="grid-2"><article class="card">${cardHead('فصل الصلاحيات الأكاديمية','منع تركّز الإشراف والتقييم والقرار عند وكيل واحد')}${table(['الدور','الصلاحية','قيد الاستقلال'],[['المشرف الأكاديمي','توجيه البحث ومتابعة التنفيذ','لا يصدر قرار التخرج منفردًا'],['الممتحن الداخلي','فحص المنهج والإسهام','ليس وكيل المشرف ولا من مزوده نفسه'],['الممتحن الخارجي','تقييم مستقل ومقارنة معيارية','جهة ونموذج وسياق منفصل'],['لجنة الجودة','مراجعة المعايير والاتساق','تسبيب القرار وتوثيق اختلاف الرأي'],['مراجع الاعتراض','فحص الحالة والبيانات وسجل القرار','لم يشارك في القرار الأول']].map(r=>`<tr>${r.map((c,i)=>`<td class="${i===0?'primary-cell':''}">${c}</td>`).join('')}</tr>`).join(''))}</article><article class="card">${cardHead('سجل المخاطر والضوابط','حالات مرتبطة بإجراءات علاجية')}<div class="activity-list"><div class="activity"><span class="activity-icon">!</span><div><div class="activity-title">تفاوت في تقدير مهمة عملية</div><div class="activity-desc">مقارنة المصححين وإعادة مراجعة العينة</div></div>${status('قيد المعالجة','warn')}</div><div class="activity"><span class="activity-icon">✓</span><div><div class="activity-title">مصدر غير قابل للتحقق في مسودة</div><div class="activity-desc">حُذف المصدر ووُثق سبب التعديل</div></div>${status('مغلق','good')}</div><div class="activity"><span class="activity-icon">↺</span><div><div class="activity-title">اعتراض على نتيجة تشخيص</div><div class="activity-desc">أُحيل إلى مراجع مستقل خارج المسار</div></div>${status('مراجعة مستقلة','blue')}</div></div><div class="divider"></div><div class="alert-box">لا يُستخدم اكتشاف النصوص الآلية وحده دليلًا على الغش أو على أصالة العمل؛ القرار يعتمد على سجل الإسهام والمناقشة والأدلة المناسبة.</div></article></div><article class="card">${cardHead('سجل القرارات الأخير','المراجع والإصدار والتسبيب محفوظة')}${logTable()}</article>`}
function logTable(){let entries=[['21 أكتوبر · 10:42','مراجعة أهلية طلب AIE-0268','وكيل القبول · نموذج v2.3'],['21 أكتوبر · 09:18','إحالة طلب اعتراض إلى مراجع مستقل','وكيل السجل · مسار تظلم'],['20 أكتوبر · 15:07','إيقاف وكيل تقييم مؤقتًا للمعايرة','لجنة الجودة · قرار رقم 041'],['20 أكتوبر · 12:30','تحديث خطة تعلم بعد إثبات الكفاية','وكيل الإرشاد · سجل تعلم']];return `<div class="log-list">${entries.map(x=>`<div class="log-item"><span class="log-time">${x[0]}</span><span class="log-action">${x[1]}</span><span class="log-by">${x[2]}</span></div>`).join('')}</div>`}
function pageSettings(){return `${heading('إدارة النظام','الإعدادات وسجل القرار','إعدادات تشغيل النموذج وقواعد الإفصاح والصلاحيات. هذه الواجهة لا تحفظ مفاتيح أو بيانات خارج جهازك.',btn('تصدير بيانات النموذج','export','btn-primary','export'))}<div class="grid-2"><article class="card">${cardHead('سياسة تشغيل الوكلاء','الافتراض الحالي: محاكاة بلا طلبات إلى مزود خارجي')}<div class="settings-row"><div><strong>وضع المحاكاة</strong><small>تشغيل تفاعلات تجريبية ببيانات محلية بدل استدعاء نموذج فعلي.</small></div><button class="switch on" data-action="toggle-demo"><i></i></button></div><div class="settings-row"><div><strong>مراجعة مستقلة للقرارات العالية الأثر</strong><small>إحالة القبول النهائي والتخرج والقرارات التأديبية لمراجعة ثانية.</small></div><button class="switch on" data-action="toggle-demo"><i></i></button></div><div class="settings-row"><div><strong>سجل إصدارات النماذج</strong><small>توثيق اسم المزود والإصدار والتعليمات والاختبارات لكل وكيل.</small></div><button class="switch on" data-action="toggle-demo"><i></i></button></div><div class="settings-row"><div><strong>قناة اعتراض الطالب</strong><small>طلب تصحيح بيانات أو إعادة مراجعة لقرار أكاديمي.</small></div><button class="switch on" data-action="toggle-demo"><i></i></button></div></article><article class="card">${cardHead('ربط النماذج','حقول إعداد توضيحية غير متصلة')}<div class="alert-box">لن تُرسل هذه النسخة أي بيانات إلى مزود ذكاء اصطناعي. الربط الفعلي يحتاج خادمًا آمنًا، وسياسة خصوصية، وعقود معالجة بيانات، واختبارات مستقلة.</div><div style="height:12px"></div><div class="field"><label>مزود النموذج (تصور)</label><select disabled><option>غير مربوط — وضع المحاكاة</option><option>مزود مؤسسي (يتطلب إعدادًا)</option></select></div><div class="divider"></div><div class="settings-row"><div><strong>إعادة بيانات المحاكاة</strong><small>استعادة السجلات الافتراضية على هذا الجهاز فقط.</small></div><button class="btn" data-action="reset-demo">إعادة الضبط</button></div></article></div><article class="card" style="margin-top:16px">${cardHead('سجل القرار')}<div class="log-list">${logTable().replace(/<div class="log-list">|<\/div>$/g,'')}</div></article>`}
function render(){document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.page===activePage));document.getElementById('crumb').textContent=pageNames[activePage];document.getElementById('admissionBadge').textContent=state.apps.length;const pages={overview:pageOverview,journey:pageJourney,programs:pagePrograms,admissions:pageAdmissions,agents:pageAgents,research:pageResearch,assessment:pageAssessment,labs:pageLabs,governance:pageGovernance,settings:pageSettings};document.getElementById('content').innerHTML=(pages[activePage]||pageOverview)();applySearch();}
function go(page){if(!pageNames[page])return;activePage=page;render();document.getElementById('sidebar').classList.remove('open');document.getElementById('mobileOverlay').classList.remove('show');window.scrollTo({top:0,behavior:'smooth'})}
function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),2600)}
function applySearch(){const q=searchTerm.trim().toLowerCase();document.querySelectorAll('[data-searchable]').forEach(el=>el.style.display=!q||el.dataset.searchable.includes(q)?'':'none')}
function modal(title,desc,fields,submit,submitLabel='حفظ'){document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" data-action="close-modal"><form class="modal" id="modalForm"><div class="modal-head"><div><h2>${title}</h2><p>${desc}</p></div><button type="button" class="close" data-action="close-modal">×</button></div><div class="form-grid">${fields}</div><div class="modal-foot"><button class="btn btn-primary" type="submit">${submitLabel}</button><button class="btn" type="button" data-action="close-modal">إلغاء</button></div></form></div>`;document.getElementById('modalForm').onsubmit=e=>{e.preventDefault();submit(new FormData(e.currentTarget));document.getElementById('modalRoot').innerHTML=''};}
function field(label,name,placeholder='',type='text',full=false,opts=''){return `<div class="field ${full?'full':''}"><label>${label}</label>${opts?`<select name="${name}" required>${opts}</select>`:type==='textarea'?`<textarea name="${name}" placeholder="${placeholder}" required></textarea>`:`<input name="${name}" type="${type}" placeholder="${placeholder}" ${name==='name'||name==='role'?'required':''}>`}</div>`}
function openForm(action){if(action==='new-application'){modal('إضافة طلب التحاق تجريبي','لا تستخدم بيانات شخصية حقيقية؛ سيُحفظ الطلب محليًا في هذا المتصفح.',field('اسم افتراضي','name','مثال: ليان محمد')+field('المسار المطلوب','program','','text',false,'<option>مسار علوم البيانات</option><option>مسار البحث والسياسات</option><option>مسار هندسة الحلول</option>')+field('الخطوة الحالية','stage','','text',false,'<option>الوثائق</option><option>التشخيص الأكاديمي</option><option>اختبار الاستعداد</option>'),fd=>{state.apps.unshift({id:'AIE-'+Math.floor(1000+Math.random()*8999),name:fd.get('name'),program:fd.get('program'),date:'21 أكتوبر 2026',status:'جديد',tone:'blue',stage:fd.get('stage'),note:'طلب تجريبي'});save();render();toast('أُضيف طلب تجريبي إلى سجل القبول')},'إضافة الطلب');}
if(action==='new-agent'){modal('تعيين وكيل أكاديمي تجريبي','حدد الدور ونطاقه؛ يمر الوكيل الحقيقي بالمعايرة قبل تفعيل صلاحياته.',field('اسم الوكيل','name','مثال: د. ريم منصور')+field('الدور الأكاديمي','role','مثال: أستاذة تقييم')+field('التخصص','field','مثال: التقويم التربوي')+field('عائلة النموذج','model','مثال: نموذج أكاديمي G')+field('نطاق العمل','scope','','text',true,'<option>تدريس ومراجعة</option><option>إرشاد الطالب</option><option>إشراف بحثي</option><option>تقييم مستقل</option>'),fd=>{let name=fd.get('name');state.agents.unshift({id:'ag-'+Date.now(),name,initial:name[0]||'و',role:fd.get('role'),field:fd.get('field'),model:fd.get('model'),state:'تحت المعايرة',stateTone:'warn',scope:fd.get('scope'),score:'بانتظار الاختبار'});save();render();toast('سُجل الوكيل بحالة المعايرة')},'تسجيل الوكيل');}
if(action==='new-research'){modal('تسجيل مقترح بحث تجريبي','يُسند مبدئيًا إلى مشرف؛ تشكيل اللجنة يظل مستقلًا عن المشرف.',field('عنوان البحث','title','عنوان أولي', 'text',true)+field('اسم الباحث الافتراضي','student','مثال: ناصر خالد')+field('التخصص','field','','text',false,'<option>علوم البيانات</option><option>سياسات التقنية</option><option>هندسة الحلول</option>'),fd=>{state.research.unshift({id:'RS-'+Math.floor(100+Math.random()*899),title:fd.get('title'),student:fd.get('student'),supervisor:'يحدد بعد فحص المقترح',stage:'إيداع المقترح',tone:'blue',progress:10,committee:['المشرف: بانتظار التعيين','داخلي: بانتظار التعيين','خارجي: بانتظار التعيين']});save();render();toast('أُضيف المقترح إلى مسار الدراسات العليا')},'تسجيل المقترح');}
if(action==='add-program'||action==='new-assessment'||action==='new-lab'){toast('تم تسجيل الفكرة في قائمة التطوير التجريبية')}
}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-page]');if(nav){go(nav.dataset.page);return}const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='menu'){document.getElementById('sidebar').classList.toggle('open');document.getElementById('mobileOverlay').classList.toggle('show');return}if(a==='close-modal'){document.getElementById('modalRoot').innerHTML='';return}if(['new-application','new-agent','new-research','add-program','new-assessment','new-lab'].includes(a)){openForm(a);return}if(a==='go-journey'){go('journey');return}if(a==='go-governance'){go('governance');return}if(a==='complete-lesson'){state.courseProgress=Math.min(100,state.courseProgress+11);save();render();toast(state.courseProgress>=100?'اكتملت الوحدة التجريبية':'سُجل النشاط؛ تقدّم الإتقان '+state.courseProgress+'%');return}if(a==='advance-app'){let id=b.dataset.id,app=state.apps.find(x=>x.id===id);if(app){if(app.tone==='warn'){app.status='أُحيل للتشخيص';app.tone='blue';app.stage='التشخيص الأكاديمي'}else if(app.tone==='bad'){app.status='طلب استكمال';app.tone='warn';app.stage='الوثائق'}else{app.status='مؤهل مبدئيًا';app.tone='good';app.stage='اختبار الاستعداد'}save();render();toast('حُدثت حالة الطلب وسُجل الانتقال')};return}if(a==='toggle-agent'){let ag=state.agents.find(x=>x.id===b.dataset.id);if(ag){if(ag.state==='معتمد'){ag.state='موقوف مؤقتًا';ag.stateTone='bad'}else{ag.state='تحت المعايرة';ag.stateTone='warn'}save();render();toast('حُدثت صلاحية الوكيل في النموذج')};return}if(a==='review-stage'){state.completedReviews++;save();toast('اكتملت مراجعة تجريبية؛ أُضيفت ملاحظة إلى السجل');return}if(a==='agent-filter'){document.querySelectorAll('.filter-chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');let f=b.dataset.filter;document.querySelectorAll('.agent-card').forEach(el=>el.style.display=f==='all'||el.innerText.includes(f)?'':'none');return}if(a==='export'){const blob=new Blob([JSON.stringify({version:'0.1',exportedAt:new Date().toISOString(),demo:true,state},null,2)],{type:'application/json'});let url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='aie-demo-data.json';link.click();URL.revokeObjectURL(url);toast('تم تنزيل بيانات المحاكاة بصيغة JSON');return}if(a==='reset-demo'){if(confirm('إعادة سجلات المحاكاة إلى حالتها الأولى؟')){localStorage.removeItem('aie-demo-state');state=loadState();render();toast('أُعيدت بيانات المحاكاة')};return}if(a==='role'){activeRole=activeRole==='إدارة الجامعة'?'الطالب':'إدارة الجامعة';document.getElementById('roleLabel').textContent=activeRole;toast('تغير المنظور إلى '+activeRole+' — بيانات العرض ثابتة في هذه النسخة');return}if(a==='notifications'){toast(state.noticeRead?'لا توجد تنبيهات جديدة':'تنبيه: نسخة العرض تستخدم بيانات تجريبية فقط');state.noticeRead=true;save();return}if(a==='open-program'){toast('خطة البرنامج نموذجية؛ تفاصيل الوحدات في مرحلة التصور');return}if(a==='launch-lab'){toast('بيئة المحاكاة معطلة في النسخة الأولى؛ لا يوجد اتصال بمختبر فعلي');return}if(a==='toggle-demo'){b.classList.toggle('on');toast('هذه الإعدادات شكلية في نموذج العرض فقط');return}});
document.getElementById('globalSearch').addEventListener('input',e=>{searchTerm=e.target.value;applySearch()});document.getElementById('mobileOverlay').addEventListener('click',()=>{document.getElementById('sidebar').classList.remove('open');document.getElementById('mobileOverlay').classList.remove('show')});
render();
</script>
</body>
